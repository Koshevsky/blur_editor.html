<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blur Editor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d14; --surface: #13131f; --surface2: #1c1c2e;
    --accent: #7c5cfc; --accent2: #fc5c7d;
    --text: #e2e2f0; --muted: #55556e; --border: #252538;
  }
  html, body {
    height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'SF Mono', 'Fira Code', monospace;
    overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100dvh; width: 100%; }

  #header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0; min-height: 42px;
  }
  #header h1 { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .05em; }
  #hint { font-size: 10px; color: var(--muted); max-width: 55%; text-align: right; }

  #canvas-area {
    flex: 1; position: relative; background: #000; overflow: hidden;
    touch-action: none; cursor: crosshair;
  }
  #canvas-area canvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none;
  }
  #overlay-svg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; overflow: visible;
  }
  #draw-rect { fill: rgba(124,92,252,0.2); stroke: #7c5cfc; stroke-width: 2.5; stroke-dasharray: none; display: none; }
  .cdot { fill: #7c5cfc; display: none; }

  #draw-badge {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(124,92,252,.92); color: #fff; font-size: 11px;
    padding: 5px 16px; border-radius: 14px; pointer-events: none;
    opacity: 0; transition: opacity .18s; white-space: nowrap;
  }
  #draw-badge.show { opacity: 1; }

  #coords {
    position: absolute; top: 8px; left: 8px;
    background: rgba(13,13,20,.88); border: 1px solid var(--border);
    padding: 4px 8px; font-size: 10px; color: var(--accent);
    border-radius: 4px; display: none; line-height: 1.75; pointer-events: none;
  }

  #no-img {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: var(--muted); font-size: 11px; text-align: center; padding: 24px;
  }
  #no-img svg { opacity: .2; margin-bottom: 4px; }

  #loading {
    position: absolute; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; z-index: 50;
  }
  #loading.hidden { display: none; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-txt { font-size: 10px; color: var(--muted); letter-spacing: .09em; text-transform: uppercase; }

  #regions-bar {
    background: var(--surface); border-top: 1px solid var(--border);
    max-height: 90px; overflow-y: auto; flex-shrink: 0;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .rrow {
    display: flex; align-items: center; padding: 5px 12px;
    border-bottom: 1px solid var(--border); gap: 7px; font-size: 10px;
  }
  .rdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .rinfo { flex: 1; color: var(--text); }
  .rtime { color: var(--accent); }
  .rdel { background: none; border: none; color: var(--accent2); font-size: 15px; cursor: pointer; padding: 0 3px; }
  .rempty { text-align: center; color: var(--muted); font-size: 10px; padding: 12px; }

  #tl-section {
    background: var(--surface2); border-top: 1px solid var(--border);
    padding: 8px 14px 6px; flex-shrink: 0;
  }
  .tl-lbl { font-size: 9px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 5px; }
  #tl-track {
    position: relative; height: 24px; background: var(--bg);
    border-radius: 6px; border: 1px solid var(--border);
  }
  #tl-fill {
    position: absolute; top: 0; bottom: 0;
    background: rgba(124,92,252,.22);
    border-left: 3px solid var(--accent); border-right: 3px solid var(--accent);
    pointer-events: none;
  }
  .tl-h {
    position: absolute; top: 50%; width: 16px; height: 28px;
    background: var(--accent); border-radius: 4px;
    cursor: ew-resize; touch-action: none;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(124,92,252,.45); z-index: 5;
  }
  .tl-h::before {
    content: ''; width: 2px; height: 9px; background: rgba(255,255,255,.5);
    border-radius: 1px; box-shadow: 3px 0 0 rgba(255,255,255,.4),-3px 0 0 rgba(255,255,255,.4);
  }
  #tl-hs { transform: translate(-50%,-50%); }
  #tl-he { transform: translate(50%,-50%); }
  #tl-info { display:flex; justify-content:space-between; margin-top:4px; font-size:9px; color:var(--muted); }
  #tl-lbl2 { text-align:center; font-size:10px; color:var(--accent); margin-top:2px; }

  #bottom {
    display: flex; gap: 8px; padding: 8px 14px;
    background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .btn {
    flex: 1; padding: 10px 6px; border: none; border-radius: 8px;
    font-family: inherit; font-size: 11px; font-weight: 600;
    letter-spacing: .04em; text-transform: uppercase; cursor: pointer; transition: transform .1s;
  }
  .btn:active { transform: scale(.96); }
  .btn-sec { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
  .btn-add { background: transparent; color: var(--accent); border: 1px solid var(--accent); flex: 0 0 auto; padding: 10px 14px; }
  .btn-pri { background: var(--accent); color: #fff; box-shadow: 0 3px 12px rgba(124,92,252,.35); }
  .btn-pri:disabled { background: var(--border); color: var(--muted); box-shadow: none; cursor: not-allowed; }

  #toast {
    position: fixed; bottom: 76px; left: 50%;
    transform: translateX(-50%) translateY(14px);
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-size: 11px; padding: 7px 16px;
    border-radius: 20px; opacity: 0; transition: all .2s;
    pointer-events: none; white-space: nowrap; z-index: 999;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>🎯 Blur Editor</h1>
    <span id="hint">Рисуй пальцем</span>
  </div>

  <div id="canvas-area">
    <canvas id="cv"></canvas>
    <svg id="overlay-svg" xmlns="http://www.w3.org/2000/svg">
      <rect id="draw-rect" rx="3"/>
      <circle class="cdot" id="c-tl" r="5"/>
      <circle class="cdot" id="c-tr" r="5"/>
      <circle class="cdot" id="c-bl" r="5"/>
      <circle class="cdot" id="c-br" r="5"/>
    </svg>
    <div id="draw-badge">✏️ РИСУЮ</div>
    <div id="coords"></div>
    <div id="no-img">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <span>Превью недоступно.<br>Рисуй область как будто видео здесь.</span>
    </div>
    <div id="loading">
      <div class="spinner"></div>
      <div class="load-txt">Загружаю превью</div>
    </div>
  </div>

  <div id="regions-bar">
    <div class="rempty" id="rempty">Нет выделенных областей</div>
  </div>

  <div id="tl-section">
    <div class="tl-lbl">Временной диапазон блюра</div>
    <div id="tl-track">
      <div id="tl-fill"></div>
      <div class="tl-h" id="tl-hs"></div>
      <div class="tl-h" id="tl-he"></div>
    </div>
    <div id="tl-info"><span id="tl-s">0:00</span><span id="tl-d">0:00</span></div>
    <div id="tl-lbl2">Весь ролик</div>
  </div>

  <div id="bottom">
    <button class="btn btn-sec" id="btn-reset">Сброс</button>
    <button class="btn btn-add" id="btn-add">+ Добавить</button>
    <button class="btn btn-pri" id="btn-send" disabled>Применить</button>
  </div>
</div>
<div id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ── Параметры ─────────────────────────────────────────────────────────
// Превью приходит в hash: #img=BASE64
// Длительность в query: ?dur=30
const params   = new URLSearchParams(location.search);
const duration = Math.max(1, parseFloat(params.get('dur') || '30'));

// Читаем hash
function getHashParam(key) {
  const hash = location.hash.slice(1); // убираем #
  const p = new URLSearchParams(hash);
  return p.get(key) || '';
}
const imgB64 = getHashParam('img');

// ── Состояние ─────────────────────────────────────────────────────────
let regions = [], tlStart = 0, tlEnd = duration;
let draggingTl = null, drawing = false, p0 = null, p1 = null;
const COLORS = ['#7c5cfc','#fc5c7d','#5cf8ca','#f8d95c','#fc955c','#5ca8fc'];
let colorIdx = 0;

// ── DOM ───────────────────────────────────────────────────────────────
const area    = document.getElementById('canvas-area');
const cv      = document.getElementById('cv');
const ctx     = cv.getContext('2d');
const drect   = document.getElementById('draw-rect');
const cdots   = ['c-tl','c-tr','c-bl','c-br'].map(id => document.getElementById(id));
const badge   = document.getElementById('draw-badge');
const cords   = document.getElementById('coords');
const regBar  = document.getElementById('regions-bar');
const rempty  = document.getElementById('rempty');
const tlTrack = document.getElementById('tl-track');
const tlFill  = document.getElementById('tl-fill');
const tlHs    = document.getElementById('tl-hs');
const tlHe    = document.getElementById('tl-he');
const tlS     = document.getElementById('tl-s');
const tlD     = document.getElementById('tl-d');
const tl2     = document.getElementById('tl-lbl2');
const btnAdd  = document.getElementById('btn-add');
const btnRst  = document.getElementById('btn-reset');
const btnSend = document.getElementById('btn-send');
const loading = document.getElementById('loading');
const noImg   = document.getElementById('no-img');
const hint    = document.getElementById('hint');

const fmt = s => `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`;
function toast(msg, ms=1800) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),ms);
}

// ── Canvas ────────────────────────────────────────────────────────────
let imgEl = null;
new ResizeObserver(()=>{ cv.width=area.clientWidth; cv.height=area.clientHeight; redraw(); }).observe(area);

function redraw() {
  ctx.clearRect(0,0,cv.width,cv.height);
  if (!imgEl) return;
  const iw=imgEl.naturalWidth, ih=imgEl.naturalHeight;
  const cw=cv.width, ch=cv.height;
  const sc=Math.min(cw/iw, ch/ih);
  ctx.drawImage(imgEl,(cw-iw*sc)/2,(ch-ih*sc)/2,iw*sc,ih*sc);
}

// ── Загрузка превью из base64 ─────────────────────────────────────────
if (imgB64) {
  const src = 'data:image/jpeg;base64,' + decodeURIComponent(imgB64);
  const i = new Image();
  i.onload = () => {
    imgEl = i;
    loading.classList.add('hidden');
    noImg.style.display = 'none';
    redraw();
  };
  i.onerror = () => {
    loading.classList.add('hidden');
    noImg.style.display = 'flex';
  };
  i.src = src;
} else {
  loading.classList.add('hidden');
  noImg.style.display = 'flex';
}

// ── Координаты ────────────────────────────────────────────────────────
function getPct(e) {
  const r=area.getBoundingClientRect(), s=e.touches?e.touches[0]:e;
  return { x:Math.max(0,Math.min(1,(s.clientX-r.left)/r.width)),
           y:Math.max(0,Math.min(1,(s.clientY-r.top)/r.height)) };
}

// ── Рамка ─────────────────────────────────────────────────────────────
function renderSel(a,b) {
  if (!a||!b) { drect.style.display='none'; cdots.forEach(c=>c.style.display='none'); return; }
  const r=area.getBoundingClientRect();
  const x1=Math.min(a.x,b.x)*r.width, y1=Math.min(a.y,b.y)*r.height;
  const x2=Math.max(a.x,b.x)*r.width, y2=Math.max(a.y,b.y)*r.height;
  drect.setAttribute('x',x1); drect.setAttribute('y',y1);
  drect.setAttribute('width',x2-x1); drect.setAttribute('height',y2-y1);
  drect.style.display='block';
  [[x1,y1],[x2,y1],[x1,y2],[x2,y2]].forEach(([cx,cy],i)=>{
    cdots[i].setAttribute('cx',cx); cdots[i].setAttribute('cy',cy); cdots[i].style.display='block';
  });
  cords.style.display='block';
  cords.innerHTML=
    `X:${(Math.min(a.x,b.x)*100).toFixed(0)}–${(Math.max(a.x,b.x)*100).toFixed(0)}% `+
    `Y:${(Math.min(a.y,b.y)*100).toFixed(0)}–${(Math.max(a.y,b.y)*100).toFixed(0)}%`;
}

// ── Touch/Mouse ───────────────────────────────────────────────────────
function onDown(e) {
  if (e.target===tlHs||e.target===tlHe) return;
  if (e.target.closest&&(e.target.closest('#bottom')||e.target.closest('#tl-section'))) return;
  e.preventDefault(); e.stopPropagation();
  drawing=true; p0=getPct(e); p1={...p0};
  badge.classList.add('show'); hint.textContent='Рисую…';
}
function onMove(e) {
  if (!drawing) return; e.preventDefault(); p1=getPct(e); renderSel(p0,p1);
}
function onUp() {
  if (!drawing) return; drawing=false;
  badge.classList.remove('show'); hint.textContent='Рисуй пальцем';
  const dx=Math.abs((p1?.x||0)-(p0?.x||0)), dy=Math.abs((p1?.y||0)-(p0?.y||0));
  if (dx<0.02||dy<0.02) { renderSel(null,null); cords.style.display='none'; p0=null; p1=null; }
}

area.addEventListener('touchstart',onDown,{passive:false,capture:true});
area.addEventListener('touchmove', onMove,{passive:false,capture:true});
area.addEventListener('touchend',  onUp,  {passive:false,capture:true});
area.addEventListener('mousedown', onDown,{capture:true});
window.addEventListener('mousemove',onMove);
window.addEventListener('mouseup',  onUp);

// ── Добавить ─────────────────────────────────────────────────────────
btnAdd.addEventListener('click',()=>{
  if (!p0||!p1) { toast('Сначала нарисуй область'); return; }
  const x1=Math.min(p0.x,p1.x), x2=Math.max(p0.x,p1.x);
  const y1=Math.min(p0.y,p1.y), y2=Math.max(p0.y,p1.y);
  if ((x2-x1)<0.02||(y2-y1)<0.02) { toast('Область слишком маленькая'); return; }
  regions.push({
    x1:+x1.toFixed(4),y1:+y1.toFixed(4),
    x2:+x2.toFixed(4),y2:+y2.toFixed(4),
    t0:+tlStart.toFixed(2),t1:+tlEnd.toFixed(2),
    color:COLORS[colorIdx++%COLORS.length]
  });
  renderSel(null,null); cords.style.display='none'; p0=null; p1=null;
  renderRegions(); btnSend.disabled=false; toast('✓ Добавлено');
});

// ── Сброс ────────────────────────────────────────────────────────────
btnRst.addEventListener('click',()=>{
  regions=[]; p0=null; p1=null; tlStart=0; tlEnd=duration;
  renderSel(null,null); cords.style.display='none';
  updateTl(); renderRegions(); btnSend.disabled=true; toast('Сброшено');
});

// ── Регионы ───────────────────────────────────────────────────────────
function renderRegions() {
  regBar.querySelectorAll('.rrow').forEach(r=>r.remove());
  if (!regions.length) { rempty.style.display='block'; return; }
  rempty.style.display='none';
  regions.forEach((r,i)=>{
    const isAll=r.t0<=0.1&&r.t1>=duration-0.1;
    const row=document.createElement('div'); row.className='rrow';
    row.innerHTML=`
      <div class="rdot" style="background:${r.color}"></div>
      <div class="rinfo">
        X:${(r.x1*100).toFixed(0)}–${(r.x2*100).toFixed(0)}%
        &nbsp;Y:${(r.y1*100).toFixed(0)}–${(r.y2*100).toFixed(0)}%
        <span class="rtime">&nbsp;${isAll?'весь ролик':fmt(r.t0)+'→'+fmt(r.t1)}</span>
      </div>
      <button class="rdel" data-i="${i}">✕</button>`;
    regBar.appendChild(row);
  });
  regBar.querySelectorAll('.rdel').forEach(btn=>btn.addEventListener('click',e=>{
    regions.splice(+e.currentTarget.dataset.i,1);
    if(!regions.length) btnSend.disabled=true;
    renderRegions(); toast('Удалено');
  }));
}

// ── Timeline ─────────────────────────────────────────────────────────
function updateTl() {
  const ps=tlStart/duration, pe=tlEnd/duration;
  tlFill.style.left=(ps*100)+'%'; tlFill.style.right=((1-pe)*100)+'%';
  tlHs.style.left=(ps*100)+'%'; tlHe.style.right=((1-pe)*100)+'%';
  tlS.textContent=fmt(tlStart); tlD.textContent=fmt(duration);
  tl2.textContent=(tlStart<=0.1&&tlEnd>=duration-0.1)
    ?'Весь ролик':`▶ ${fmt(tlStart)} — ${fmt(tlEnd)}`;
}
function tlPct(e) {
  const r=tlTrack.getBoundingClientRect(), s=e.touches?e.touches[0]:e;
  return Math.max(0,Math.min(1,(s.clientX-r.left)/r.width));
}
const startTl=w=>e=>{e.stopPropagation();e.preventDefault();draggingTl=w;};
tlHs.addEventListener('touchstart',startTl('start'),{passive:false});
tlHe.addEventListener('touchstart',startTl('end'),  {passive:false});
tlHs.addEventListener('mousedown', startTl('start'));
tlHe.addEventListener('mousedown', startTl('end'));
function moveTl(e){
  if(!draggingTl) return; e.preventDefault();
  const p=tlPct(e)*duration;
  if(draggingTl==='start') tlStart=Math.max(0,Math.min(p,tlEnd-1));
  else                      tlEnd=Math.min(duration,Math.max(p,tlStart+1));
  updateTl();
}
window.addEventListener('touchmove',moveTl,{passive:false});
window.addEventListener('mousemove',moveTl);
window.addEventListener('touchend', ()=>{draggingTl=null;});
window.addEventListener('mouseup',  ()=>{draggingTl=null;});

// ── Отправка ─────────────────────────────────────────────────────────
btnSend.addEventListener('click',()=>{
  if (!regions.length) return;
  const payload=JSON.stringify({
    regions:regions.map(({x1,y1,x2,y2,t0,t1})=>({x1,y1,x2,y2,t0,t1}))
  });
  if (tg) tg.sendData(payload);
  else alert('Payload:\n'+payload);
});

// ── Init ─────────────────────────────────────────────────────────────
updateTl();
renderRegions();
</script>
</body>
</html>
