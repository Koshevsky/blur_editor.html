<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blur Editor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0d14; --surface: #13131f; --surface2: #1c1c2e;
  --accent: #7c5cfc; --danger: #fc5c7d;
  --text: #e2e2f0; --muted: #55556e; --border: #252538;
}
html, body {
  height: 100%; width: 100%;
  background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none;
}
#app { display: flex; flex-direction: column; height: 100dvh; width: 100%; }

#header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px; background: var(--surface);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
#header h1 { font-size: 13px; font-weight: 700; color: var(--accent); }
#hint { font-size: 10px; color: var(--muted); max-width: 55%; text-align: right; }

#canvas-wrap {
  flex: 1; position: relative; background: #111; overflow: hidden;
  touch-action: none; cursor: crosshair; min-height: 0;
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
#ov {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; overflow: visible;
}
.rbox { fill: none; stroke-width: 2.5; }
.rbox-fill { stroke: none; }
.rlabel { font-size: 12px; font-weight: 700; font-family: system-ui, sans-serif; }
#draw-rect { fill: rgba(124,92,252,.15); stroke: #7c5cfc; stroke-width: 2.5;
             stroke-dasharray: 6 3; display: none; }
.handle { fill: #7c5cfc; display: none; }

#badge {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  background: rgba(124,92,252,.92); color: #fff; font-size: 11px;
  padding: 5px 16px; border-radius: 14px; pointer-events: none;
  opacity: 0; transition: opacity .15s; white-space: nowrap;
}
#badge.on { opacity: 1; }

#no-img-grid {
  position: absolute; inset: 0; display: none;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}
#no-img-label {
  position: absolute; inset: 0; display: none;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; pointer-events: none;
}
#no-img-label span { font-size: 10px; color: var(--muted); text-align: center; padding: 0 24px; }

#loading {
  position: absolute; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; z-index: 50;
}
#loading.off { display: none; }
.spin {
  width: 32px; height: 32px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

#scrubber-section {
  background: var(--surface2); border-top: 1px solid var(--border);
  padding: 7px 14px 5px; flex-shrink: 0;
}
.sec-lbl { font-size: 9px; color: var(--muted); letter-spacing: .08em;
           text-transform: uppercase; margin-bottom: 4px; }
#scrub-track {
  position: relative; height: 24px;
  background: var(--bg); border-radius: 6px; border: 1px solid var(--border);
  touch-action: none; cursor: pointer;
}
#scrub-prog {
  position: absolute; top: 0; bottom: 0; left: 0;
  background: rgba(124,92,252,.25); border-radius: 5px 0 0 5px; pointer-events: none;
}
#scrub-head {
  position: absolute; top: 50%; width: 16px; height: 28px;
  background: var(--accent); border-radius: 4px;
  transform: translate(-50%,-50%); cursor: ew-resize;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(124,92,252,.5); z-index: 5;
}
#scrub-head::before {
  content: ''; width: 2px; height: 8px; background: rgba(255,255,255,.5);
  border-radius: 1px; box-shadow: 3px 0 0 rgba(255,255,255,.4), -3px 0 0 rgba(255,255,255,.4);
}
#scrub-info { display: flex; justify-content: space-between; margin-top: 2px;
              font-size: 9px; color: var(--muted); }
#scrub-now { color: var(--accent); }

#range-section {
  background: var(--surface2); border-top: 1px solid var(--border);
  padding: 6px 14px 5px; flex-shrink: 0;
}
#tl-track {
  position: relative; height: 22px;
  background: var(--bg); border-radius: 5px; border: 1px solid var(--border);
  touch-action: none;
}
#tl-fill {
  position: absolute; top: 0; bottom: 0;
  background: rgba(252,92,125,.20);
  border-left: 3px solid var(--danger); border-right: 3px solid var(--danger);
  pointer-events: none;
}
.tl-h {
  position: absolute; top: 50%; width: 14px; height: 26px;
  background: var(--danger); border-radius: 4px;
  cursor: ew-resize; touch-action: none;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(252,92,125,.5); z-index: 5;
}
.tl-h::before {
  content: ''; width: 2px; height: 8px; background: rgba(255,255,255,.5);
  border-radius: 1px; box-shadow: 3px 0 0 rgba(255,255,255,.35), -3px 0 0 rgba(255,255,255,.35);
}
#tl-hs { transform: translate(-50%,-50%); }
#tl-he { transform: translate(50%,-50%); }
#tl-info { display: flex; justify-content: space-between; margin-top: 2px;
           font-size: 9px; color: var(--muted); }
#tl-range { color: var(--danger); text-align: center; font-size: 9px; margin-top: 2px; }

#regions-bar {
  background: var(--surface); border-top: 1px solid var(--border);
  max-height: 72px; overflow-y: auto; flex-shrink: 0;
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
.rrow {
  display: flex; align-items: center; padding: 5px 12px;
  border-bottom: 1px solid var(--border); gap: 7px; font-size: 10px;
}
.rdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.rinfo { flex: 1; color: var(--text); }
.rtime { color: var(--accent); }
.rdel { background: none; border: none; color: var(--danger); font-size: 15px;
        cursor: pointer; padding: 0 3px; line-height: 1; }
.rempty { text-align: center; color: var(--muted); font-size: 10px; padding: 10px; }

#bottom {
  display: flex; gap: 8px; padding: 8px 14px;
  background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0;
}
.btn {
  flex: 1; padding: 10px 6px; border: none; border-radius: 8px;
  font-family: inherit; font-size: 11px; font-weight: 700;
  letter-spacing: .04em; text-transform: uppercase; cursor: pointer;
  transition: transform .1s, opacity .15s;
}
.btn:active { transform: scale(.96); }
.btn-sec { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
.btn-add { background: transparent; color: var(--accent); border: 1.5px solid var(--accent);
           flex: 0 0 auto; padding: 10px 16px; }
.btn-pri { background: var(--accent); color: #fff; }
.btn-pri:disabled { opacity: .4; cursor: not-allowed; }
.btn-pri.done { background: #2d8a55; }

#status-bar {
  display: none; position: fixed; bottom: 62px; left: 50%;
  transform: translateX(-50%);
  background: rgba(13,13,20,.95); border: 1px solid var(--border);
  color: var(--text); font-size: 11px; padding: 8px 18px;
  border-radius: 20px; z-index: 999; white-space: nowrap;
  box-shadow: 0 4px 20px rgba(0,0,0,.5);
}
#status-bar.show { display: block; }

#toast {
  position: fixed; bottom: 70px; left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); font-size: 11px; padding: 7px 16px;
  border-radius: 20px; opacity: 0; transition: all .2s;
  pointer-events: none; white-space: nowrap; z-index: 998;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>🎯 Blur Editor</h1>
    <span id="hint">Нарисуй → Добавить → Применить</span>
  </div>

  <div id="canvas-wrap">
    <canvas id="cv"></canvas>
    <div id="no-img-grid"></div>
    <div id="no-img-label">
      <span style="font-size:26px;opacity:.25">🎬</span>
      <span>Превью не загрузилось.<br>Рисуй область — блюр применится точно по координатам.</span>
    </div>
    <svg id="ov" xmlns="http://www.w3.org/2000/svg">
      <rect id="draw-rect" rx="3"/>
      <circle class="handle" id="h-tl" r="5"/>
      <circle class="handle" id="h-tr" r="5"/>
      <circle class="handle" id="h-bl" r="5"/>
      <circle class="handle" id="h-br" r="5"/>
    </svg>
    <div id="badge">✏️ РИСУЮ</div>
    <div id="loading">
      <div class="spin"></div>
      <div style="font-size:10px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;">Загружаю превью</div>
    </div>
  </div>

  <div id="scrubber-section">
    <div class="sec-lbl">Позиция предпросмотра</div>
    <div id="scrub-track">
      <div id="scrub-prog"></div>
      <div id="scrub-head"></div>
    </div>
    <div id="scrub-info">
      <span id="scrub-now">0:00</span>
      <span id="scrub-end">0:00</span>
    </div>
  </div>

  <div id="range-section">
    <div class="sec-lbl">Интервал блюра</div>
    <div id="tl-track">
      <div id="tl-fill"></div>
      <div class="tl-h" id="tl-hs"></div>
      <div class="tl-h" id="tl-he"></div>
    </div>
    <div id="tl-info">
      <span id="tl-s">0:00</span>
      <span id="tl-d">0:00</span>
    </div>
    <div id="tl-range">Весь ролик</div>
  </div>

  <div id="regions-bar">
    <div class="rempty" id="rempty">Нет выделенных областей</div>
  </div>

  <div id="bottom">
    <button class="btn btn-sec" id="btn-rst">Сброс</button>
    <button class="btn btn-add" id="btn-add">+ Добавить</button>
    <button class="btn btn-pri" id="btn-send" disabled>Применить</button>
  </div>
</div>

<div id="status-bar"></div>
<div id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
try { if (tg) { tg.ready(); tg.expand(); } } catch(e) {}

const params   = new URLSearchParams(location.search);
const duration = Math.max(1, parseFloat(params.get('dur') || '30'));
const uid      = params.get('uid')   || '';
const token    = params.get('token') || '';
const port     = parseInt(params.get('port') || '8765');
const imgB64   = params.get('img')   || '';

const SERVER_URL = `http://127.0.0.1:${port}/blur`;

let regions = [], tlStart = 0, tlEnd = duration, scrubTime = 0;
let drawing = false, p0 = null, p1 = null;
let draggingTl = null, draggingScrub = false;
const COLORS = ['#7c5cfc','#fc5c7d','#5cf8ca','#f8d95c','#fc955c','#5ca8fc'];
let colorIdx = 0;

const wrap       = document.getElementById('canvas-wrap');
const cv         = document.getElementById('cv');
const ctx        = cv.getContext('2d');
const ov         = document.getElementById('ov');
const drect      = document.getElementById('draw-rect');
const handles    = ['h-tl','h-tr','h-bl','h-br'].map(id=>document.getElementById(id));
const badge      = document.getElementById('badge');
const noGrid     = document.getElementById('no-img-grid');
const noLabel    = document.getElementById('no-img-label');
const loading    = document.getElementById('loading');
const hintEl     = document.getElementById('hint');
const regBar     = document.getElementById('regions-bar');
const rempty     = document.getElementById('rempty');
const btnAdd     = document.getElementById('btn-add');
const btnRst     = document.getElementById('btn-rst');
const btnSend    = document.getElementById('btn-send');
const statusBar  = document.getElementById('status-bar');
const scrubTrack = document.getElementById('scrub-track');
const scrubProg  = document.getElementById('scrub-prog');
const scrubHead  = document.getElementById('scrub-head');
const scrubNow   = document.getElementById('scrub-now');
const scrubEnd   = document.getElementById('scrub-end');
const tlTrack    = document.getElementById('tl-track');
const tlFill     = document.getElementById('tl-fill');
const tlHs       = document.getElementById('tl-hs');
const tlHe       = document.getElementById('tl-he');
const tlS        = document.getElementById('tl-s');
const tlD        = document.getElementById('tl-d');
const tlRange    = document.getElementById('tl-range');

const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

// ── Canvas resize ─────────────────────────────────────────────────
new ResizeObserver(()=>{
  cv.width=wrap.clientWidth; cv.height=wrap.clientHeight;
  redraw(); updateRegionOverlay();
}).observe(wrap);

function redraw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(!imgEl) return;
  const iw=imgEl.naturalWidth||imgEl.width, ih=imgEl.naturalHeight||imgEl.height;
  if(!iw||!ih) return;
  const sc=Math.min(cv.width/iw, cv.height/ih);
  ctx.drawImage(imgEl,(cv.width-iw*sc)/2,(cv.height-ih*sc)/2,iw*sc,ih*sc);
}

// ── Preview image — base64 data URI, no external requests ─────────
let imgEl = null;

function showNoPreview(){
  loading.classList.add('off');
  noGrid.style.display='block';
  noLabel.style.display='flex';
}

if(imgB64){
  const img = new Image();
  img.onload = () => {
    imgEl=img;
    loading.classList.add('off');
    noGrid.style.display='none';
    noLabel.style.display='none';
    cv.width=wrap.clientWidth; cv.height=wrap.clientHeight;
    redraw();
  };
  img.onerror = showNoPreview;
  img.src = 'data:image/jpeg;base64,' + imgB64;
} else {
  showNoPreview();
}

// ── Scrubber ──────────────────────────────────────────────────────
scrubEnd.textContent = fmt(duration);
updateScrubUI();
function updateScrubUI(){
  const p=duration>0?scrubTime/duration:0;
  scrubProg.style.width=(p*100)+'%';
  scrubHead.style.left=(p*100)+'%';
  scrubNow.textContent=fmt(scrubTime);
}
function scrubPct(e){
  const r=scrubTrack.getBoundingClientRect();
  const s=e.touches?e.touches[0]:e;
  return Math.max(0,Math.min(1,(s.clientX-r.left)/r.width));
}
scrubTrack.addEventListener('touchstart',e=>{
  draggingScrub=true; e.preventDefault(); e.stopPropagation();
  scrubTime=scrubPct(e)*duration; updateScrubUI();
},{passive:false});
scrubTrack.addEventListener('mousedown',e=>{
  draggingScrub=true; scrubTime=scrubPct(e)*duration; updateScrubUI();
});
window.addEventListener('touchmove',e=>{
  if(draggingScrub){e.preventDefault();scrubTime=scrubPct(e)*duration;updateScrubUI();}
},{passive:false});
window.addEventListener('mousemove',e=>{
  if(draggingScrub){scrubTime=scrubPct(e)*duration;updateScrubUI();}
});
window.addEventListener('touchend',()=>{draggingScrub=false;});
window.addEventListener('mouseup',()=>{draggingScrub=false;});

// ── Blur range ────────────────────────────────────────────────────
updateTl();
function updateTl(){
  const ps=tlStart/duration, pe=tlEnd/duration;
  tlFill.style.left=(ps*100)+'%';
  tlFill.style.right=((1-pe)*100)+'%';
  tlHs.style.left=(ps*100)+'%';
  tlHe.style.right=((1-pe)*100)+'%';
  tlS.textContent=fmt(tlStart);
  tlD.textContent=fmt(duration);
  const isAll=tlStart<=0.1&&tlEnd>=duration-0.1;
  tlRange.textContent=isAll?'Весь ролик':`▶ ${fmt(tlStart)} — ${fmt(tlEnd)}`;
}
function tlPct(e){
  const r=tlTrack.getBoundingClientRect();
  const s=e.touches?e.touches[0]:e;
  return Math.max(0,Math.min(1,(s.clientX-r.left)/r.width));
}
const startTl=w=>e=>{e.stopPropagation();e.preventDefault();draggingTl=w;};
tlHs.addEventListener('touchstart',startTl('s'),{passive:false});
tlHe.addEventListener('touchstart',startTl('e'),{passive:false});
tlHs.addEventListener('mousedown',startTl('s'));
tlHe.addEventListener('mousedown',startTl('e'));
window.addEventListener('touchmove',e=>{
  if(!draggingTl)return; e.preventDefault();
  const p=tlPct(e)*duration;
  if(draggingTl==='s')tlStart=Math.max(0,Math.min(p,tlEnd-0.5));
  else                 tlEnd  =Math.min(duration,Math.max(p,tlStart+0.5));
  updateTl();
},{passive:false});
window.addEventListener('mousemove',e=>{
  if(!draggingTl)return;
  const p=tlPct(e)*duration;
  if(draggingTl==='s')tlStart=Math.max(0,Math.min(p,tlEnd-0.5));
  else                 tlEnd  =Math.min(duration,Math.max(p,tlStart+0.5));
  updateTl();
});
window.addEventListener('touchend',()=>{draggingTl=null;});
window.addEventListener('mouseup',()=>{draggingTl=null;});

// ── Drawing ───────────────────────────────────────────────────────
function getPos(e){
  const r=wrap.getBoundingClientRect();
  const s=e.touches?e.touches[0]:e;
  return{x:Math.max(0,Math.min(1,(s.clientX-r.left)/r.width)),
         y:Math.max(0,Math.min(1,(s.clientY-r.top)/r.height))};
}
function showDrawRect(a,b){
  if(!a||!b){drect.style.display='none';handles.forEach(h=>h.style.display='none');return;}
  const r=wrap.getBoundingClientRect();
  const x1=Math.min(a.x,b.x)*r.width,y1=Math.min(a.y,b.y)*r.height;
  const x2=Math.max(a.x,b.x)*r.width,y2=Math.max(a.y,b.y)*r.height;
  drect.setAttribute('x',x1);drect.setAttribute('y',y1);
  drect.setAttribute('width',x2-x1);drect.setAttribute('height',y2-y1);
  drect.style.display='block';
  [[x1,y1],[x2,y1],[x1,y2],[x2,y2]].forEach(([cx,cy],i)=>{
    handles[i].setAttribute('cx',cx);handles[i].setAttribute('cy',cy);
    handles[i].style.display='block';
  });
}
function isCtrl(e){
  if(!e.target)return false;
  return e.target===tlHs||e.target===tlHe||
    !!e.target.closest('#bottom,#tl-track,#range-section,#scrubber-section,#regions-bar');
}
wrap.addEventListener('touchstart',e=>{
  if(isCtrl(e))return; e.preventDefault(); e.stopPropagation();
  drawing=true; p0=getPos(e); p1={...p0};
  badge.classList.add('on'); hintEl.textContent='Рисую…';
},{passive:false,capture:true});
wrap.addEventListener('touchmove',e=>{
  if(!drawing)return; e.preventDefault(); p1=getPos(e); showDrawRect(p0,p1);
},{passive:false,capture:true});
wrap.addEventListener('touchend',onUp,{passive:false,capture:true});
wrap.addEventListener('mousedown',e=>{
  if(isCtrl(e))return; e.preventDefault();
  drawing=true; p0=getPos(e); p1={...p0};
  badge.classList.add('on'); hintEl.textContent='Рисую…';
},{capture:true});
window.addEventListener('mousemove',e=>{if(drawing){p1=getPos(e);showDrawRect(p0,p1);}});
window.addEventListener('mouseup',onUp);
function onUp(){
  if(!drawing)return; drawing=false;
  badge.classList.remove('on');
  hintEl.textContent='Нарисуй → Добавить → Применить';
  if(Math.abs((p1?.x||0)-(p0?.x||0))<0.02||Math.abs((p1?.y||0)-(p0?.y||0))<0.02){
    showDrawRect(null,null); p0=null; p1=null;
  }
}

// ── Add region ────────────────────────────────────────────────────
btnAdd.addEventListener('click',()=>{
  if(!p0||!p1){toast('Сначала нарисуй область');return;}
  const x1=Math.min(p0.x,p1.x),x2=Math.max(p0.x,p1.x);
  const y1=Math.min(p0.y,p1.y),y2=Math.max(p0.y,p1.y);
  if((x2-x1)<0.02||(y2-y1)<0.02){toast('Слишком маленькая область');return;}
  regions.push({x1:+x1.toFixed(4),y1:+y1.toFixed(4),
                x2:+x2.toFixed(4),y2:+y2.toFixed(4),
                t0:+tlStart.toFixed(2),t1:+tlEnd.toFixed(2),
                color:COLORS[colorIdx++%COLORS.length]});
  showDrawRect(null,null); p0=null; p1=null;
  renderRegions(); updateRegionOverlay();
  btnSend.disabled=false; toast('✓ Добавлено!');
});

// ── Reset ─────────────────────────────────────────────────────────
btnRst.addEventListener('click',()=>{
  regions=[]; colorIdx=0; p0=null; p1=null;
  tlStart=0; tlEnd=duration;
  showDrawRect(null,null); updateTl();
  renderRegions(); updateRegionOverlay();
  btnSend.disabled=true; toast('Сброшено');
});

// ── Regions list ──────────────────────────────────────────────────
function renderRegions(){
  regBar.querySelectorAll('.rrow').forEach(r=>r.remove());
  if(!regions.length){rempty.style.display='block';return;}
  rempty.style.display='none';
  regions.forEach((r,i)=>{
    const isAll=r.t0<=0.1&&r.t1>=duration-0.1;
    const row=document.createElement('div'); row.className='rrow';
    row.innerHTML=`
      <div class="rdot" style="background:${r.color}"></div>
      <div class="rinfo">
        X:${(r.x1*100).toFixed(0)}–${(r.x2*100).toFixed(0)}%
        &nbsp;Y:${(r.y1*100).toFixed(0)}–${(r.y2*100).toFixed(0)}%
        <span class="rtime">&nbsp;${isAll?'весь ролик':fmt(r.t0)+'→'+fmt(r.t1)}</span>
      </div>
      <button class="rdel" data-i="${i}">✕</button>`;
    regBar.appendChild(row);
  });
  regBar.querySelectorAll('.rdel').forEach(btn=>btn.addEventListener('click',e=>{
    regions.splice(+e.currentTarget.dataset.i,1);
    if(!regions.length)btnSend.disabled=true;
    renderRegions(); updateRegionOverlay(); toast('Удалено');
  }));
}

// ── Overlay ───────────────────────────────────────────────────────
function updateRegionOverlay(){
  ov.querySelectorAll('.rbox,.rbox-fill,.rlabel').forEach(el=>el.remove());
  const r=wrap.getBoundingClientRect();
  regions.forEach((reg,i)=>{
    const x1=reg.x1*r.width,y1=reg.y1*r.height;
    const x2=reg.x2*r.width,y2=reg.y2*r.height;
    const ns='http://www.w3.org/2000/svg';
    const fill=document.createElementNS(ns,'rect');
    fill.setAttribute('x',x1);fill.setAttribute('y',y1);
    fill.setAttribute('width',x2-x1);fill.setAttribute('height',y2-y1);
    fill.setAttribute('rx',3);fill.setAttribute('fill',reg.color);
    fill.setAttribute('fill-opacity','0.22');fill.setAttribute('class','rbox-fill');
    const box=document.createElementNS(ns,'rect');
    box.setAttribute('x',x1);box.setAttribute('y',y1);
    box.setAttribute('width',x2-x1);box.setAttribute('height',y2-y1);
    box.setAttribute('rx',3);box.setAttribute('fill','none');
    box.setAttribute('stroke',reg.color);box.setAttribute('stroke-width','2.5');
    box.setAttribute('class','rbox');
    const lbl=document.createElementNS(ns,'text');
    lbl.setAttribute('x',x1+5);lbl.setAttribute('y',y1+14);
    lbl.setAttribute('class','rlabel');lbl.setAttribute('fill',reg.color);
    lbl.textContent='#'+(i+1);
    ov.appendChild(fill);ov.appendChild(box);ov.appendChild(lbl);
  });
}
window.addEventListener('resize',updateRegionOverlay);

// ── Send ──────────────────────────────────────────────────────────
btnSend.addEventListener('click', async ()=>{
  if(!regions.length||btnSend.disabled) return;

  btnSend.disabled=true;
  btnSend.textContent='⏳ Отправляю…';

  const payload={
    uid:   parseInt(uid)||0,
    token: token,
    regions: regions.map(({x1,y1,x2,y2,t0,t1})=>({x1,y1,x2,y2,t0,t1}))
  };

  // Method 1: HTTP POST → local bot server
  let httpOk = false;
  try {
    const res = await fetch(SERVER_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload),
      signal: AbortSignal.timeout(8000),
    });
    const j = await res.json();
    httpOk = !!j.ok;
  } catch(e) {
    console.warn('HTTP POST failed:', e);
  }

  if(httpOk){
    btnSend.classList.add('done');
    btnSend.textContent='✓ Готово!';
    setStatus('✅ Бот применяет блюр…');
    setTimeout(()=>{ try{tg?.close();}catch(e){} }, 1200);
    return;
  }

  // Method 2: tg.sendData() fallback
  try {
    if(tg && typeof tg.sendData==='function'){
      tg.sendData(JSON.stringify({regions:payload.regions}));
      btnSend.classList.add('done');
      btnSend.textContent='✓ Отправлено!';
      setStatus('✅ Данные отправлены');
      setTimeout(()=>{ try{tg.close();}catch(e){} }, 1000);
      return;
    }
  } catch(e) { console.warn('sendData failed:', e); }

  // Failed
  btnSend.disabled=false;
  btnSend.textContent='Применить';
  setStatus('⚠️ Ошибка — убедись что бот запущен');
  toast('Не удалось отправить данные');
});

function setStatus(msg){
  statusBar.textContent=msg;
  statusBar.classList.add('show');
  setTimeout(()=>statusBar.classList.remove('show'),3500);
}

let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1900);
}
</script>
